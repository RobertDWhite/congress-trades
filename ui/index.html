<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="Track congressional stock trades, committee conflicts, disclosure timing, and follow-Congress backtests — from public STOCK Act filings." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Congress Trades</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker disabled: proactively unregister any previously-installed worker and clear
      // its caches so a stale/broken shell can never be served (kill-switch for all visitors).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {})
        if (window.caches) caches.keys().then((ks) => ks.forEach((k) => k.startsWith('congress-shell') && caches.delete(k))).catch(() => {})
      }
    </script>
  </body>
</html>
